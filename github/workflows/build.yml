
name: GLASSKEY Cloud Build

on:
  workflow_dispatch:
  push:
    paths:
      - 'GLASSKEY-starter.zip'
      - '.github/workflows/build.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Extract project ZIP
        run: |
          unzip -q GLASSKEY-starter.zip -d extracted
          ls -R extracted

      - name: Build APK
        working-directory: extracted/GLASSKEY
        run: |
          gradle assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: GLASSKEY-APK
          path: extracted/GLASSKEY/app/build/outputs/apk/debug/app-debug.apk
